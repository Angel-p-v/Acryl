<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" font-family="'Segoe UI', Roboto, Inter, -apple-system, BlinkMacSystemFont, sans-serif">

  <defs>
    <!-- Colores de capa -->
    <linearGradient id="g-user" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="g-frontend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="g-backend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <linearGradient id="g-db" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="g-ext" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M 0 0 L 12 4 L 0 8 Z" fill="#6b7280" />
    </marker>

    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.15" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="750" fill="#ffffff" />

  <title>Flujo de datos de Acryl</title>

  <!-- ===================================================================== -->
  // 1. USUARIO (nodo inicial, círculo)
  <!-- ===================================================================== -->
  <g id="n-user" filter="url(#drop-shadow)">
    <circle cx="130" cy="140" r="42" fill="url(#g-user)" stroke="#4f46e5" stroke-width="2.5" />
    <text x="130" y="138" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Usuario</text>
    <text x="130" y="158" font-size="10" fill="#4f46e5" text-anchor="middle">busca / reproduce</text>
  </g>

  <!-- Flecha usuario → frontend -->
  <path d="M 172 140 Q 210 140 240 140" stroke="#4f46e5" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 2. FRONTEND (rectángulo redondeado)
  <!-- ===================================================================== -->
  <g id="n-frontend" filter="url(#drop-shadow)">
    <rect x="280" y="100" width="240" height="90" rx="12" fill="url(#g-frontend)" stroke="#2563eb" stroke-width="2" />
    <text x="400" y="124" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Frontend</text>
    <text x="400" y="142" font-size="10" fill="#1e3a8a" text-anchor="middle">React + TypeScript</text>
    <text x="400" y="156" font-size="9" fill="#1e3a8a" text-anchor="middle">SearchBar · MediaList · VideoPlayer</text>
  </g>

  <!-- Flecha frontend → commands -->
  <path d="M 400 190 Q 450 210 500 220" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="455" y="205" font-size="9" fill="#2563eb" font-style="italic">invoke (Tauri IPC)</text>

  <!-- ===================================================================== -->
  // 3. BACKEND COMMANDS
  <!-- ===================================================================== -->
  <g id="n-commands" filter="url(#drop-shadow)">
    <rect x="490" y="210" width="240" height="80" rx="12" fill="url(#g-backend)" stroke="#059669" stroke-width="2" />
    <text x="610" y="234" font-size="14" font-weight="700" fill="#064e3b" text-anchor="middle">Commands</text>
    <text x="610" y="252" font-size="10" fill="#064e3b" text-anchor="middle">adaptador → valida entrada</text>
  </g>

  <!-- Flecha commands → decisión -->
  <path d="M 610 290 Q 610 310 610 320" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 4. DECISIÓN (diamante)
  <!-- ===================================================================== -->
  <g id="n-decision" filter="url(#drop-shadow)">
    <path d="M 610 320 L 690 355 L 610 390 L 530 355 Z" fill="url(#g-backend)" stroke="#059669" stroke-width="2" />
    <text x="610" y="348" font-size="10" font-weight="700" fill="#064e3b" text-anchor="middle">¿Consulta</text>
    <text x="610" y="362" font-size="10" font-weight="700" fill="#064e3b" text-anchor="middle">o reproduce?</text>
  </g>

  <!-- Flecha decisión → SQLite (izquierda) -->
  <path d="M 545 370 Q 430 370 320 370" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="430" y="362" font-size="9" fill="#064e3b" text-anchor="middle">consulta SQLite</text>

  <!-- Flecha decisión → libmpv (derecha) -->
  <path d="M 675 370 Q 790 370 900 370" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="785" y="362" font-size="9" fill="#064e3b" text-anchor="middle">reproduce con libmpv</text>

  <!-- ===================================================================== -->
  // 5a. SQLITE (izquierda)
  <!-- ===================================================================== -->
  <g id="n-sqlite" filter="url(#drop-shadow)">
    <rect x="150" y="330" width="220" height="90" rx="12" fill="url(#g-db)" stroke="#4f46e5" stroke-width="2" />
    <text x="260" y="354" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">SQLite</text>
    <text x="260" y="372" font-size="9" fill="#3730a3" text-anchor="middle">acryl.db</text>
    <text x="260" y="386" font-size="8" fill="#3730a3" text-anchor="middle">media · media_files ·</text>
    <text x="260" y="398" font-size="8" fill="#3730a3" text-anchor="middle">playback_history · FTS5</text>
  </g>

  <!-- Flecha SQLite → retorno frontend -->
  <path d="M 260 420 Q 260 450 260 480" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 5b. LIBMPV (derecha)
  <!-- ===================================================================== -->
  <g id="n-mpv" filter="url(#drop-shadow)">
    <rect x="830" y="330" width="220" height="90" rx="12" fill="url(#g-backend)" stroke="#059669" stroke-width="2" />
    <text x="940" y="354" font-size="14" font-weight="700" fill="#064e3b" text-anchor="middle">libmpv</text>
    <text x="940" y="372" font-size="9" fill="#064e3b" text-anchor="middle">(FFI)</text>
    <text x="940" y="386" font-size="8" fill="#064e3b" text-anchor="middle">reproduce vídeo dentro</text>
    <text x="940" y="398" font-size="8" fill="#064e3b" text-anchor="middle">de la ventana</text>
  </g>

  <!-- Flecha libmpv → retorno frontend -->
  <path d="M 940 420 Q 940 450 940 480" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 6. METADATA (TVmaze) - externo, opcional, arriba de la decisión
  <!-- ===================================================================== -->
  <g id="n-metadata" filter="url(#drop-shadow)">
    <rect x="480" y="410" width="260" height="70" rx="10" fill="url(#g-ext)" stroke="#b45309" stroke-width="2" />
    <text x="610" y="434" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Metadata (TVmaze)</text>
    <text x="610" y="452" font-size="9" fill="#92400e" text-anchor="middle">API pública · sin API key · opcional</text>
  </g>

  <!-- Flecha hacia metadata (desde commands) -->
  <path d="M 610 290 Q 610 350 610 380" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,4" />
  <text x="610" y="370" font-size="8" fill="#b45309" text-anchor="middle">sincroniza (opcional)</text>

  <!-- Flecha metadata → decisión -->
  <path d="M 610 480 Q 610 400 610 390" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,4" />

  <!-- ===================================================================== -->
  // 7. RETORNO a frontend (desde sqlite y mpv se unen)
  <!-- ===================================================================== -->
  <path d="M 260 480 Q 200 480 200 180" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="170" y="330" font-size="9" fill="#4f46e5" text-anchor="middle">resultados</text>
  <path d="M 940 480 Q 1000 480 1000 180" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="1020" y="330" font-size="9" fill="#059669" text-anchor="middle">resultados</text>

  <!-- Flecha retorno → frontend -->
  <path d="M 200 180 Q 280 180 280 180" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 1000 180 Q 900 180 520 190" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 8. USUARIO VE RESULTADO (nodo final, círculo)
  <!-- ===================================================================== -->
  <g id="n-result" filter="url(#drop-shadow)">
    <circle cx="400" cy="185" r="42" fill="url(#g-user)" stroke="#4f46e5" stroke-width="2.5" />
    <text x="400" y="183" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Usuario</text>
    <text x="400" y="203" font-size="10" fill="#4f46e5" text-anchor="middle">ve resultado</text>
  </g>

  <!-- Flecha resultado → usuario (ciclo de nueva búsqueda) -->
  <path d="M 400 227 Q 265 227 172 180" stroke="#3730a3" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="280" y="235" font-size="9" fill="#3730a3" text-anchor="middle">nueva búsqueda</text>

  <!-- ===================================================================== -->
  // Leyenda inferior
  <!-- ===================================================================== -->
  <g transform="translate(40, 690)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#g-user)" stroke="#4f46e5" stroke-width="1" />
    <text x="20" y="11" font-size="10" fill="#3730a3">Usuario (inicio / fin)</text>

    <rect x="210" y="0" width="14" height="14" rx="3" fill="url(#g-frontend)" stroke="#2563eb" stroke-width="1" />
    <text x="230" y="11" font-size="10" fill="#1e3a8a">Frontend (React + TypeScript)</text>

    <rect x="460" y="0" width="14" height="14" rx="3" fill="url(#g-backend)" stroke="#059669" stroke-width="1" />
    <text x="480" y="11" font-size="10" fill="#064e3b">Backend (Rust + Tauri)</text>

    <rect x="680" y="0" width="14" height="14" rx="3" fill="url(#g-db)" stroke="#4f46e5" stroke-width="1" />
    <text x="700" y="11" font-size="10" fill="#3730a3">Base de datos SQLite</text>

    <rect x="860" y="0" width="14" height="14" rx="3" fill="url(#g-ext)" stroke="#b45309" stroke-width="1" />
    <text x="880" y="11" font-size="10" fill="#92400e">Servicio externo (TVmaze)</text>

    <path d="M 1010 7 L 1030 7" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" />
    <text x="1040" y="10" font-size="10" fill="#374151">Flujo de datos</text>
  </g>

</svg>