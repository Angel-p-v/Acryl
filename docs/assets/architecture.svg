<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="700" viewBox="0 0 1100 700" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <!-- Gradientes -->
    <linearGradient id="grad-frontend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="grad-backend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="grad-db" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0.05" />
    </linearGradient>

    <!-- Marcador de flecha -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>

    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1100" height="700" fill="#ffffff" />

  <!-- ===================================================================== -->
  // CAPA 1: FRONTEND
  <!-- ===================================================================== -->
  <g id="layer-frontend" filter="url(#shadow)">
    <!-- Contenedor -->
    <rect x="40" y="40" width="520" height="260" rx="12" fill="url(#grad-frontend)" stroke="#2563eb" stroke-width="2" />
    <text x="70" y="30" font-size="16" font-weight="700" fill="#1e3a8a">FRONTEND</text>
    <text x="70" y="52" font-size="11" fill="#1e3a8a" opacity="0.8">React + TypeScript (Vite · WebView de Tauri)</text>

    <!-- Línea separadora interna -->
    <line x1="40" y1="78" x2="560" y2="78" stroke="#2563eb" stroke-width="1" opacity="0.3" />

    <!-- Componentes -->
    <g transform="translate(70, 95)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="57" y="28" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">SearchBar</text>
      <rect x="10" y="42" width="95" height="4" rx="2" fill="#e2e8f0" />
      <rect x="10" y="52" width="60" height="4" rx="2" fill="#e2e8f0" />
    </g>
    <g transform="translate(195, 95)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="57" y="28" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">MediaList</text>
      <rect x="10" y="42" width="95" height="4" rx="2" fill="#e2e8f0" />
      <rect x="10" y="52" width="60" height="4" rx="2" fill="#e2e8f0" />
    </g>
    <g transform="translate(320, 95)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="57" y="28" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">MediaDetails</text>
      <rect x="10" y="42" width="95" height="4" rx="2" fill="#e2e8f0" />
      <rect x="10" y="52" width="60" height="4" rx="2" fill="#e2e8f0" />
    </g>
    <g transform="translate(445, 95)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="57" y="28" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">VideoPlayer</text>
      <rect x="10" y="42" width="95" height="4" rx="2" fill="#e2e8f0" />
      <rect x="10" y="52" width="60" height="4" rx="2" fill="#e2e8f0" />
    </g>

    <!-- Etiqueta de IPC -->
    <text x="295" y="210" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="600">invoke (Tauri IPC)</text>
    <path d="M 295 218 L 295 240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)" />
  </g>

  <!-- ===================================================================== -->
  // CAPA 2: BACKEND
  <!-- ===================================================================== -->
  <g id="layer-backend" filter="url(#shadow)">
    <rect x="40" y="260" width="520" height="260" rx="12" fill="url(#grad-backend)" stroke="#059669" stroke-width="2" />
    <text x="70" y="290" font-size="16" font-weight="700" fill="#064e3b">BACKEND</text>
    <text x="70" y="312" font-size="11" fill="#064e3b" opacity="0.8">Rust + Tauri v2 · Comandos expuestos al frontend</text>

    <line x1="40" y1="338" x2="560" y2="338" stroke="#059669" stroke-width="1" opacity="0.3" />

    <!-- Módulos backend -->
    <g transform="translate(70, 355)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="57" y="23" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">Commands</text>
      <text x="57" y="40" font-size="9" fill="#64748b" text-anchor="middle">(adaptador)</text>
      <rect x="10" y="54" width="95" height="3" rx="1.5" fill="#e2e8f0" />
      <rect x="10" y="63" width="55" height="3" rx="1.5" fill="#e2e8f0" />
    </g>
    <g transform="translate(195, 355)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="57" y="23" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">Config</text>
      <text x="57" y="40" font-size="9" fill="#64748b" text-anchor="middle">(YAML)</text>
      <rect x="10" y="54" width="95" height="3" rx="1.5" fill="#e2e8f0" />
      <rect x="10" y="63" width="55" height="3" rx="1.5" fill="#e2e8f0" />
    </g>
    <g transform="translate(320, 355)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="57" y="23" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">Metadata</text>
      <text x="57" y="40" font-size="9" fill="#64748b" text-anchor="middle">(TVmaze)</text>
      <rect x="10" y="54" width="95" height="3" rx="1.5" fill="#e2e8f0" />
      <rect x="10" y="63" width="55" height="3" rx="1.5" fill="#e2e8f0" />
    </g>
    <g transform="translate(445, 355)">
      <rect x="0" y="0" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="57" y="23" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">Player</text>
      <text x="57" y="40" font-size="9" fill="#64748b" text-anchor="middle">(libmpv FFI)</text>
      <rect x="10" y="54" width="95" height="3" rx="1.5" fill="#e2e8f0" />
      <rect x="10" y="63" width="55" height="3" rx="1.5" fill="#e2e8f0" />
    </g>

    <!-- Etiqueta de base de datos -->
    <text x="295" y="475" font-size="10" fill="#059669" text-anchor="middle" font-weight="600">SQLite (acryl.db) · libmpv</text>
    <path d="M 295 483 L 295 505" stroke="#059669" stroke-width="2" marker-end="url(#arrowhead)" />
  </g>

  <!-- ===================================================================== -->
  // CAPA 3: BASE DE DATOS
  <!-- ===================================================================== -->
  <g id="layer-db" filter="url(#shadow)">
    <rect x="600" y="40" width="460" height="480" rx="12" fill="url(#grad-db)" stroke="#4f46e5" stroke-width="2" />
    <text x="630" y="30" font-size="16" font-weight="700" fill="#3730a3">BASE DE DATOS</text>
    <text x="630" y="52" font-size="11" fill="#3730a3" opacity="0.8">SQLite · acril.db · FTS5 · WAL</text>

    <line x1="600" y1="78" x2="1060" y2="78" stroke="#4f46e5" stroke-width="1" opacity="0.3" />

    <!-- Tabla media -->
    <g transform="translate(630, 95)">
      <rect x="0" y="0" width="135" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="67" y="18" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">media</text>
      <line x1="10" y1="28" x2="125" y2="28" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="44" font-size="9" fill="#334155">id (PK)</text>
      <text x="12" y="58" font-size="9" fill="#334155">type · title · sort_title</text>
      <text x="12" y="72" font-size="9" fill="#334155">year · folder_path</text>
      <text x="12" y="86" font-size="9" fill="#334155">poster_path · synopsis</text>
      <text x="12" y="100" font-size="9" fill="#334155">is_favorite · is_watched</text>
    </g>

    <!-- Tabla media_files -->
    <g transform="translate(785, 95)">
      <rect x="0" y="0" width="135" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="67" y="18" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">media_files</text>
      <line x1="10" y1="28" x2="125" y2="28" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="44" font-size="9" fill="#334155">id (PK)</text>
      <text x="12" y="58" font-size="9" fill="#334155">media_id (FK → media.id)</text>
      <text x="12" y="72" font-size="9" fill="#334155">season · episode · title</text>
      <text x="12" y="86" font-size="9" fill="#334155">file_path (UQ) · size_bytes</text>
      <text x="12" y="100" font-size="9" fill="#334155">mtime_ms · indexed_at</text>
    </g>

    <!-- Tabla playback_history -->
    <g transform="translate(940, 95)">
      <rect x="0" y="0" width="110" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="55" y="18" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">playback_history</text>
      <line x1="10" y1="28" x2="100" y2="28" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="44" font-size="9" fill="#334155">id (PK)</text>
      <text x="12" y="58" font-size="9" fill="#334155">media_id (FK → media.id)</text>
      <text x="12" y="72" font-size="9" fill="#334155">played_at · position · duration</text>
    </g>

    <!-- FTS5 -->
    <g transform="translate(630, 225)">
      <rect x="0" y="0" width="270" height="55" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
      <text x="135" y="20" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">media_fts — tabla virtual FTS5 sobre media.title</text>
      <text x="135" y="38" font-size="9" fill="#64748b" text-anchor="middle">Triggers de insert / delete / update para mantener el índice</text>
    </g>

    <!-- schema_migrations -->
    <g transform="translate(915, 225)">
      <rect x="0" y="0" width="135" height="55" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
      <text x="67" y="20" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">schema_migrations</text>
      <text x="67" y="38" font-size="9" fill="#64748b" text-anchor="middle">versión · nombre (control de migraciones)</text>
    </g>

    <!-- Relaciones FK -->
    <line x1="765" y1="125" x2="785" y2="125" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowhead)" />
    <text x="775" y="118" font-size="8" fill="#64748b" text-anchor="middle">FK</text>
    <line x1="920" y1="125" x2="940" y2="125" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowhead)" />
    <text x="930" y="118" font-size="8" fill="#64748b" text-anchor="middle">FK</text>

    <!-- Nota -->
    <text x="630" y="310" font-size="10" fill="#64748b" font-style="italic">Todas las tablas usan INTEGER PRIMARY KEY y datetime('now') por defecto.</text>
  </g>

  <!-- ===================================================================== -->
  // FLECHAS ENTRE CAPAS (ya están en los grupos, flecha adicional capa completa)
  <!-- ===================================================================== -->
  <line x1="295" y1="300" x2="295" y2="260" stroke="#1e293b" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.6" />

  <!-- Leyenda inferior -->
  <g transform="translate(40, 545)">
    <rect x="0" y="0" width="15" height="15" rx="3" fill="#3b82f6" opacity="0.15" stroke="#2563eb" stroke-width="1" />
    <text x="22" y="12" font-size="10" fill="#374151">Frontend (React + TypeScript)</text>
    <rect x="200" y="0" width="15" height="15" rx="3" fill="#10b981" opacity="0.15" stroke="#059669" stroke-width="1" />
    <text x="222" y="12" font-size="10" fill="#374151">Backend (Rust + Tauri)</text>
    <rect x="420" y="0" width="15" height="15" rx="3" fill="#6366f1" opacity="0.15" stroke="#4f46e5" stroke-width="1" />
    <text x="442" y="12" font-size="10" fill="#374151">Base de datos SQLite (acril.db)</text>
    <path d="M 620 8 L 640 8" stroke="#1e293b" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="650" y="12" font-size="10" fill="#374151">Flujo de dependencias / datos</text>
  </g>

</svg>