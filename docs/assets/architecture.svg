<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <!-- Colores estilo técnico -->
    <linearGradient id="g-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="g-header-frontend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="g-header-backend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="g-header-db" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="g-header-ext" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#374151" />
    </marker>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="0" dy="3" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.12" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="700" fill="#ffffff" />
  <title>Flujo de datos de Acryl</title>

  <!-- ===================================================================== -->
  // FUNCION: caja técnica
  // ===================================================================== -->
  <!-- (dibujadas manualmente abajo por control total) -->

  <!-- ===================================================================== -->
  // 1. USUARIO (caja simple, borde azul)
  <!-- ===================================================================== -->
  <g filter="url(#drop-shadow)">
    <rect x="40" y="90" width="140" height="70" rx="4" fill="url(#g-box)" stroke="#1e3a8a" stroke-width="1.5" />
    <text x="110" y="112" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USUARIO</text>
    <text x="110" y="129" font-size="9" fill="#475569" text-anchor="middle">inicia búsqueda / reproducción</text>
  </g>

  <!-- Flecha usuario → frontend -->
  <path d="M 180 125 Q 230 125 260 125" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 2. FRONTEND
  <!-- ===================================================================== -->
  <g filter="url(#drop-shadow)">
    <!-- Header -->
    <rect x="300" y="60" width="260" height="34" rx="3" fill="url(#g-header-frontend)" />
    <rect x="300" y="94" width="260" height="66" rx="0" fill="url(#g-box)" stroke="#1e3a8a" stroke-width="1.5" />
    <text x="430" y="80" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">FRONTEND</text>
    <text x="430" y="93" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.85">React + TypeScript (Vite)</text>
    <!-- Cuerpo -->
    <text x="320" y="116" font-size="9" fill="#1e293b">• SearchBar</text>
    <text x="320" y="130" font-size="9" fill="#1e293b">• MediaList</text>
    <text x="320" y="144" font-size="9" fill="#1e293b">• MediaDetails</text>
    <text x="320" y="158" font-size="9" fill="#1e293b">• VideoPlayer</text>
  </g>

  <!-- Flecha frontend → commands -->
  <path d="M 430 172 Q 480 190 500 210" stroke="#1e3a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="460" y="182" font-size="8" fill="#1e3a8a" font-style="italic">invoke (Tauri IPC)</text>

  <!-- ===================================================================== -->
  // 3. COMMANDS (backend)
  <!-- ===================================================================== -->
  <g filter="url(#drop-shadow)">
    <rect x="540" y="200" width="260" height="34" rx="3" fill="url(#g-header-backend)" />
    <rect x="540" y="234" width="260" height="66" rx="0" fill="url(#g-box)" stroke="#065f46" stroke-width="1.5" />
    <text x="670" y="220" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">COMMANDS</text>
    <text x="670" y="233" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.85">adaptador Tauri → Rust</text>
    <text x="560" y="256" font-size="9" fill="#1e293b">• valida entrada</text>
    <text x="560" y="270" font-size="9" fill="#1e293b">• delega al servicio</text>
  </g>

  <!-- Flecha commands → decisión -->
  <path d="M 670 300 Q 670 320 670 330" stroke="#065f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 4. DECISIÓN (diamante técnico)
  <!-- ===================================================================== -->
  <g filter="url(#drop-shadow)">
    <path d="M 670 330 L 740 360 L 670 390 L 600 360 Z" fill="url(#g-box)" stroke="#065f46" stroke-width="1.5" />
    <text x="670" y="356" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">¿Qué operación?</text>
  </g>

  <!-- Flecha decisión → SQLite (izquierda) -->
  <path d="M 615 372 Q 500 372 380 372" stroke="#065f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="445" y="364" font-size="8" fill="#065f46" text-anchor="middle">consulta</text>

  <!-- Flecha decisión → libmpv (derecha) -->
  <path d="M 725 372 Q 840 372 940 372" stroke="#065f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="835" y="364" font-size="8" fill="#065f46" text-anchor="middle">reproduce</text>

  <!-- ===================================================================== -->
  // 5a. SQLITE (izquierda)
  <!-- ===================================================================== -->
  <g filter="url(#drop-shadow)">
    <rect x="140" y="340" width="280" height="70" rx="3" fill="url(#g-box)" stroke="#3730a3" stroke-width="1.5" />
    <rect x="140" y="340" width="280" height="24" rx="0" fill="url(#g-header-db)" />
    <text x="280" y="356" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SQLITE (acryl.db)</text>
    <text x="160" y="376" font-size="8" fill="#1e293b">• media</text>
    <text x="160" y="390" font-size="8" fill="#1e293b">• media_files</text>
    <text x="160" y="404" font-size="8" fill="#1e293b">• playback_history</text>
    <text x="230" y="404" font-size="8" fill="#1e293b">• media_fts (FTS5)</text>
  </g>

  <!-- Flecha SQLite → retorno -->
  <path d="M 280 410 Q 280 440 280 470" stroke="#3730a3" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 5b. LIBMPV (derecha)
  <!-- ===================================================================== -->
  <g filter="url(#drop-shadow)">
    <rect x="820" y="340" width="240" height="70" rx="3" fill="url(#g-box)" stroke="#065f46" stroke-width="1.5" />
    <rect x="820" y="340" width="240" height="24" rx="0" fill="url(#g-header-backend)" />
    <text x="940" y="356" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">LIBMPV (FFI)</text>
    <text x="840" y="376" font-size="8" fill="#1e293b">• reproduce vídeo</text>
    <text x="840" y="390" font-size="8" fill="#1e293b">• dentro de la app</text>
  </g>

  <!-- Flecha libmpv → retorno -->
  <path d="M 940 410 Q 940 440 940 470" stroke="#065f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 6. METADATA (TVmaze) - arriba, externo
  <!-- ===================================================================== -->
  <g filter="url(#drop-shadow)">
    <rect x="500" y="440" width="340" height="50" rx="3" fill="url(#g-box)" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5,3" />
    <rect x="500" y="440" width="340" height="20" rx="0" fill="url(#g-header-ext)" />
    <text x="670" y="454" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">METADATA (TVmaze)</text>
    <text x="670" y="472" font-size="8" fill="#92400e" text-anchor="middle">API pública · sin API key · sincronización opcional / asíncrona</text>
  </g>

  <!-- Flecha commands → metadata -->
  <path d="M 670 300 Q 670 380 670 410" stroke="#92400e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3" />
  <text x="670" y="402" font-size="8" fill="#92400e" text-anchor="middle">sincroniza (opcional)</text>

  <!-- Flecha metadata → retorno -->
  <path d="M 670 490 Q 670 520 670 530" stroke="#92400e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3" />

  <!-- ===================================================================== -->
  // 7. RETORNO unificado hacia frontend
  <!-- ===================================================================== -->
  <!-- Desde SQLite -->
  <path d="M 280 470 Q 190 470 190 110" stroke="#3730a3" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="165" y="290" font-size="8" fill="#3730a3" text-anchor="middle">datos</text>
  <!-- Desde libmpv -->
  <path d="M 940 470 Q 1030 470 1030 110" stroke="#065f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="1055" y="290" font-size="8" fill="#065f46" text-anchor="middle">frames</text>
  <!-- Desde metadata -->
  <path d="M 670 530 Q 670 590 670 600" stroke="#92400e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3" />

  <!-- Unir retornos en punto común antes de frontend -->
  <path d="M 190 110 H 260" stroke="#3730a3" stroke-width="1.5" fill="none" />
  <path d="M 1030 110 H 940" stroke="#065f46" stroke-width="1.5" fill="none" />
  <path d="M 670 600 H 670 V 180 H 560" stroke="#92400e" stroke-width="1.5" fill="none" stroke-dasharray="5,3" />

  <!-- Flecha final a frontend -->
  <path d="M 430 172 Q 480 190 500 210" stroke="#1e3a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ===================================================================== -->
  // 8. USUARIO VE RESULTADO (caja final)
  <!-- ===================================================================== -->
  <g filter="url(#drop-shadow)">
    <rect x="320" y="540" width="260" height="70" rx="4" fill="url(#g-box)" stroke="#1e3a8a" stroke-width="1.5" />
    <text x="450" y="562" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">USUARIO VE RESULTADO</text>
    <text x="450" y="579" font-size="9" fill="#475569" text-anchor="middle">póster, sinopsis, reproducción</text>
  </g>

  <!-- Flecha usuario ve resultado → nuevo ciclo -->
  <path d="M 450 610 Q 200 610 180 125" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="320" y="618" font-size="8" fill="#374151" text-anchor="middle">nueva búsqueda</text>

  <!-- ===================================================================== -->
  // Leyenda inferior
  <!-- ===================================================================== -->
  <g transform="translate(40, 660)">
    <rect x="0" y="0" width="14" height="14" fill="url(#g-box)" stroke="#1e3a8a" stroke-width="1" />
    <text x="20" y="11" font-size="9" fill="#1e3a8a">Usuario / capa de presentación</text>
    <rect x="260" y="0" width="14" height="14" fill="url(#g-box)" stroke="#065f46" stroke-width="1" />
    <text x="280" y="11" font-size="9" fill="#065f46">Backend (Rust + Tauri)</text>
    <rect x="450" y="0" width="14" height="14" fill="url(#g-box)" stroke="#3730a3" stroke-width="1" />
    <text x="470" y="11" font-size="9" fill="#3730a3">Base de datos SQLite</text>
    <rect x="620" y="0" width="14" height="14" fill="url(#g-box)" stroke="#92400e" stroke-width="1" stroke-dasharray="3,2" />
    <text x="640" y="11" font-size="9" fill="#92400e">Servicio externo (opcional)</text>
    <path d="M 760 7 L 780 7" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="790" y="10" font-size="9" fill="#374151">Flujo de datos</text>
  </g>

</svg>