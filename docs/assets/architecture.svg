<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <!-- Gradientes por capa -->
    <linearGradient id="grad-user" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-frontend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-backend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-db" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-external" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>

    <!-- Marcador de flecha -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>

    <!-- Sombra -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.2" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#ffffff" />

  <title>Diagrama de flujo de Acryl</title>

  <!-- ===================================================================== -->
  // PASO 0: Usuario (inicio)
  <!-- ===================================================================== -->
  <g id="node-user" filter="url(#shadow)">
    <ellipse cx="100" cy="120" rx="90" ry="45" fill="url(#grad-user)" stroke="#4f46e5" stroke-width="2" />
    <text x="100" y="116" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Usuario</text>
    <text x="100" y="136" font-size="11" fill="#4f46e5" text-anchor="middle">busca / reproduce</text>
  </g>

  <!-- Flecha 0 -->
  <path d="M 100 165 Q 180 180 260 180" stroke="#3730a3" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- ===================================================================== -->
  // PASO 1: Frontend
  <!-- ===================================================================== -->
  <g id="node-frontend" filter="url(#shadow)">
    <rect x="190" y="150" width="180" height="70" rx="8" fill="url(#grad-frontend)" stroke="#2563eb" stroke-width="2" />
    <text x="280" y="178" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Frontend</text>
    <text x="280" y="196" font-size="10" fill="#1e3a8a" text-anchor="middle">React + TypeScript</text>
    <text x="280" y="210" font-size="10" fill="#1e3a8a" text-anchor="middle">SearchBar · MediaList · VideoPlayer</text>
  </g>

  <!-- Flecha 1 -->
  <path d="M 370 220 Q 430 240 500 240" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="430" y="232" font-size="10" fill="#2563eb" text-anchor="middle">invoke (Tauri IPC)</text>

  <!-- ===================================================================== -->
  // PASO 2: Backend - Commands
  <!-- ===================================================================== -->
  <g id="node-commands" filter="url(#shadow)">
    <rect x="460" y="220" width="180" height="70" rx="8" fill="url(#grad-backend)" stroke="#059669" stroke-width="2" />
    <text x="550" y="248" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">Commands</text>
    <text x="550" y="266" font-size="10" fill="#064e3b" text-anchor="middle">adaptador Tauri → Rust</text>
    <text x="550" y="280" font-size="10" fill="#064e3b" text-anchor="middle">valida entrada</text>
  </g>

  <!-- Flecha 2a: a lógica de negocio -->
  <path d="M 550 290 Q 550 320 550 330" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- ===================================================================== -->
  // PASO 3: Decisión - ¿Qué operación?
  <!-- ===================================================================== -->
  <g id="node-decision" filter="url(#shadow)">
    <path d="M 550 330 L 640 365 L 550 400 L 460 365 Z" fill="url(#grad-backend)" stroke="#059669" stroke-width="2" />
    <text x="550" y="358" font-size="10" font-weight="700" fill="#064e3b" text-anchor="middle">¿Consulta</text>
    <text x="550" y="372" font-size="10" font-weight="700" fill="#064e3b" text-anchor="middle">o reproduce?</text>
  </g>

  <!-- Flecha 3a: hacia SQLite (izquierda) -->
  <path d="M 470 385 Q 400 385 320 385" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="395" y="377" font-size="10" fill="#059669" text-anchor="middle">consulta SQLite</text>

  <!-- Flecha 3b: hacia libmpv (derecha) -->
  <path d="M 630 385 Q 700 385 780 385" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="705" y="377" font-size="10" fill="#059669" text-anchor="middle">reproduce con libmpv</text>

  <!-- ===================================================================== -->
  // PASO 4a: SQLite
  <!-- ===================================================================== -->
  <g id="node-sqlite" filter="url(#shadow)">
    <rect x="190" y="350" width="180" height="70" rx="8" fill="url(#grad-db)" stroke="#4f46e5" stroke-width="2" />
    <text x="280" y="378" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">SQLite (acryl.db)</text>
    <text x="280" y="396" font-size="10" fill="#3730a3" text-anchor="middle">media · media_files ·</text>
    <text x="280" y="410" font-size="10" fill="#3730a3" text-anchor="middle">playback_history · FTS5</text>
  </g>

  <!-- Flecha 4a: retorno SQLite -->
  <path d="M 280 420 Q 280 450 280 480" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- ===================================================================== -->
  // PASO 4b: libmpv
  <!-- ===================================================================== -->
  <g id="node-mpv" filter="url(#shadow)">
    <rect x="740" y="350" width="180" height="70" rx="8" fill="url(#grad-backend)" stroke="#059669" stroke-width="2" />
    <text x="830" y="378" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">libmpv (FFI)</text>
    <text x="830" y="396" font-size="10" fill="#064e3b" text-anchor="middle">reproduce vídeo dentro</text>
    <text x="830" y="410" font-size="10" fill="#064e3b" text-anchor="middle">de la ventana de la app</text>
  </g>

  <!-- Flecha 4b: retorno libmpv -->
  <path d="M 830 420 Q 830 450 830 480" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- ===================================================================== -->
  // PASO 5: Metadata (TVmaze) - externo, opcional
  <!-- ===================================================================== -->
  <g id="node-metadata" filter="url(#shadow)">
    <rect x="460" y="470" width="180" height="70" rx="8" fill="url(#grad-external)" stroke="#b45309" stroke-width="2" />
    <text x="550" y="498" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Metadata (TVmaze)</text>
    <text x="550" y="516" font-size="10" fill="#92400e" text-anchor="middle">API pública, sin API key</text>
    <text x="550" y="530" font-size="10" fill="#92400e" text-anchor="middle">opcional / asíncrono</text>
  </g>

  <!-- Flecha hacia metadata -->
  <path d="M 550 400 Q 550 430 550 440" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="6,4" />
  <text x="550" y="435" font-size="9" fill="#b45309" text-anchor="middle">sincroniza (opcional)</text>

  <!-- Flecha desde metadata -->
  <path d="M 550 540 Q 550 560 550 580" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="6,4" />

  <!-- ===================================================================== -->
  // PASO 6: Retorno a Frontend
  <!-- ===================================================================== -->
  <path d="M 280 480 Q 200 480 200 220" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="185" y="350" font-size="10" fill="#4f46e5" text-anchor="middle">resultados</text>

  <!-- ===================================================================== -->
  // PASO 7: Usuario ve resultado (fin)
  <!-- ===================================================================== -->
  <g id="node-result" filter="url(#shadow)">
    <ellipse cx="280" cy="220" rx="90" ry="45" fill="url(#grad-user)" stroke="#4f46e5" stroke-width="2" />
    <text x="280" y="216" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Usuario ve</text>
    <text x="280" y="236" font-size="11" fill="#4f46e5" text-anchor="middle">resultados en pantalla</text>
  </g>

  <!-- Flecha desde resultado de vuelta a inicio (ciclo) -->
  <path d="M 280 265 Q 100 265 100 165" stroke="#3730a3" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="180" y="215" font-size="9" fill="#3730a3" text-anchor="middle">nueva búsqueda</text>

  <!-- ===================================================================== -->
  // Leyenda
  <!-- ===================================================================== -->
  <g transform="translate(40, 700)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="url(#grad-user)" stroke="#4f46e5" stroke-width="1" />
    <text x="24" y="13" font-size="11" fill="#3730a3">Usuario (inicio / fin)</text>
    <rect x="200" y="0" width="16" height="16" rx="3" fill="url(#grad-frontend)" stroke="#2563eb" stroke-width="1" />
    <text x="224" y="13" font-size="11" fill="#1e3a8a">Frontend (React + TypeScript)</text>
    <rect x="440" y="0" width="16" height="16" rx="3" fill="url(#grad-backend)" stroke="#059669" stroke-width="1" />
    <text x="464" y="13" font-size="11" fill="#064e3b">Backend (Rust + Tauri)</text>
    <rect x="660" y="0" width="16" height="16" rx="3" fill="url(#grad-db)" stroke="#4f46e5" stroke-width="1" />
    <text x="684" y="13" font-size="11" fill="#3730a3">Base de datos SQLite</text>
    <rect x="860" y="0" width="16" height="16" rx="3" fill="url(#grad-external)" stroke="#b45309" stroke-width="1" />
    <text x="884" y="13" font-size="11" fill="#92400e">Servicio externo (TVmaze)</text>
    <path d="M 1020 8 L 1040 8" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="1050" y="11" font-size="11" fill="#374151">Flujo de datos</text>
  </g>

</svg>