[package]
name = "acryl"
version = "0.2.0"
description = "Gestor de contenido multimedia de escritorio para Linux"
authors = ["Angel-p-v"]
license = "MIT"
repository = "https://github.com/Angel-p-v/app-media-manager"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "acryl"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", default-features = false }
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
gtk4 = "0.11"
libadwaita = "0.9"
gdk-pixbuf = "0.20"
glib = "0.20"
urlencoding = "2.1"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[workspace]
