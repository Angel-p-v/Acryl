[package]
name = "acryl"
version = "0.2.0"
description = "Gestor de contenido multimedia de escritorio para Linux"
authors = ["Angel-p-v"]
license = "MIT"
repository = "https://github.com/Angel-p-v/app-media-manager"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "acryl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json"] }
gtk4 = "0.11"
libadwaita = "0.9"
gdk-pixbuf = "0.20"
glib = "0.19"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3"

[workspace]
