name: Release artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Tag de la release que recibe los assets
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release que recibe los assets
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '>=22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - run: cd frontend && npm run build

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Instalar dependencias de sistema de Tauri (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Construir instaladores con Tauri
        run: cargo tauri build
        working-directory: src-tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Listar artifacts generados
        run: find src-tauri/target/release/bundle -type f | sort

      - name: Subir assets a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for asset in src-tauri/target/release/bundle/*/*/*.{deb,AppImage,rpm,tar.gz,zip}; do
            [ -f "$asset" ] || continue
            gh release upload "${{ inputs.tag }}" "$asset" --clobber --repo "${{ github.repository }}"
          done
