name: Release artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Tag de la release que recibe los assets
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release que recibe los assets
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Instalar dependencias de sistema (GTK4/Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev \
            libadwaita-1-dev \
            librsvg2-dev \
            libgdk-pixbuf2.0-dev \
            pkg-config

      - name: Compilar aplicación
        run: cargo build --release

      - name: Listar binario generado
        run: find target/release/acryl -type f | sort

      - name: Subir binario a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" target/release/acryl --clobber --repo "${{ github.repository }}"
