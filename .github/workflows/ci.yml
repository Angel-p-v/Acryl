name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-rust:
    name: verify (Rust backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Instalar dependencias de sistema (GTK4/Linux)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev \
            libadwaita-1-dev \
            librsvg2-dev \
            pkg-config \
            xvfb
      - name: Cachear binarios de cargo (cargo-audit, cargo-tarpaulin)
        id: cache-cargo-bin
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Instalar cargo-audit (omitido si está en caché)
        if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --force
      - name: Instalar cargo-tarpaulin (omitido si está en caché)
        if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --force --version 0.37.5 --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --all-targets
      - run: cargo test --all-targets --all-features
      - name: Ejecutar tests E2E con display virtual (GTK4)
        run: >-
          xvfb-run -a cargo test
          --test e2e_app
          --test settings_integration
          -- --test-threads=1
      - run: cargo audit
      # El umbral del 60 % se aplica a la lógica de negocio (config, core y db):
      # es la parte crítica y verificable de forma determinista. La UI GTK se
      # mide en el mismo informe, pero queda fuera del umbral porque su
      # cobertura de líneas no representa bien su comportamiento; sus flujos
      # críticos se cubren con los tests E2E bajo xvfb.
      - name: Cobertura de lógica de negocio (umbral mínimo 60%)
        run: |
          xvfb-run -a cargo tarpaulin --all-targets --all-features --out xml \
            --exclude-files 'src/ui/*' 'src/main.rs' \
            --fail-under 60
