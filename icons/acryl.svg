<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="acrylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo transparente -->
  <rect width="1024" height="1024" fill="none" />

  <!-- Círculo exterior acrílico -->
  <circle cx="512" cy="512" r="460" fill="url(#acrylGrad)" opacity="0.9" />
  <circle cx="512" cy="512" r="460" fill="none" stroke="white" stroke-width="4" opacity="0.3" />

  <!-- Brillo superior (efecto acrílico) -->
  <path d="M 120 512 Q 512 120 904 512 Q 512 904 120 512" fill="white" opacity="0.15" />

  <!-- Letra A estilizada (acrílica) -->
  <path d="
    M 420 880
    L 512 160
    L 604 880
    Z
  " fill="white" opacity="0.95" />

  <!-- Línea diagonal de la A -->
  <path d="M 512 160 L 512 880" stroke="url(#acrylGrad)" stroke-width="8" stroke-linecap="round" opacity="0.9" />

  <!-- Círculo central -->
  <circle cx="512" cy="512" r="140" fill="none" stroke="white" stroke-width="3" opacity="0.4" />
  <circle cx="512" cy="512" r="60" fill="white" opacity="0.3" />

  <!-- Película / marco de video sutil -->
  <rect x="320" y="320" width="384" height="384" rx="40" fill="none" stroke="white" stroke-width="2" opacity="0.25" />

  <!-- Sombra suave inferior -->
  <ellipse cx="512" cy="900" rx="300" ry="40" fill="black" opacity="0.15" />
</svg>